org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4G

# Project
version=2.2.4
group=com.dioxidelite

# Common
mod_id=dioxide-lite
mod_name=DioxideLite
mod_author=DioxideLite
license=GPL-3.0-or-later
description=A Fabric client for Minecraft 26.1.2

# Versions
java_version=25
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
fabric_version=0.150.0+26.1.2
fabric_loader_version=0.19.2

# Package one native WebRTC runtime per artifact to keep the client JAR small.
# 留空/注释 = 按构建机自动探测（macOS arm64 -> macos-aarch64，Windows x64 -> windows-x86_64 ...）。
# webrtc_platform=macos-aarch64
#
# Skija 原生库平台列表（逗号分隔）。默认按构建机探测；想同时支持 Intel + Apple Silicon 时用
#   ./gradlew build -Pskija_platforms=skija-macos-arm64,skija-macos-x64
# skija_platforms=skija-macos-arm64
#
# 需要复现上游 dev 的 67 个 libs/nested 打包方式时打开（会和上面的 Maven include 重复）：
# use_nested_libs=true
